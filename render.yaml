services:
  - type: web
    name: fog-of-war-server
    runtime: go
    rootDir: server
    buildCommand: go build -o server_bin ./cmd/server/main.go
    startCommand: ./server_bin
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: USE_MOCK_SERVICES
        value: "false"
      - key: FOG_SESSION_CONTRACT
        value: "0xA234a8D716cB592E9a39668821cca8f382213fD9"
      - key: ARBITRUM_RPC_URL
        value: "https://sepolia-rollup.arbitrum.io/rpc"
      - key: ARBITRUM_PRIVATE_KEY
        sync: false                  # set in Render dashboard — gameServer wallet private key
      - key: ALLOWED_ORIGINS
        value: https://fog-of-war.vercel.app
